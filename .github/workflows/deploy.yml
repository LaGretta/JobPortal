name: Deploy to Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish JobPortal.Api -c Release -o ./publish

      - name: Zip
        run: cd publish && zip -r ../publish.zip . && cd ..

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy
        run: az webapp deploy -g jobportal-rg -n jobportal-pl-api --src-path publish.zip --type zip