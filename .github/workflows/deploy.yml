name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish JobPortal.Api -c Release -o ./publish

      - name: Zip
        run: cd publish && zip -r ../publish.zip . && cd ..

      - uses: azure/login@v2
        with:
          creds: '${{ secrets.AZURE_CREDENTIALS }}'

      # Azure SQL пускає тільки відомі адреси. Раннер GitHub кожного разу
      # з новою, тому відкриваємо її на час прогону і закриваємо в кінці.
      - name: Open SQL firewall for this runner
        run: |
          IP=$(curl -s https://ipv4.icanhazip.com)
          az sql server firewall-rule create \
            -g jobportal-rg -s jobportal-sql-sasha2626 \
            -n gh-${{ github.run_id }} \
            --start-ip-address $IP --end-ip-address $IP

      # Міграції ДО деплою: інакше новий код прийде на базу,
      # якої він ще не знає, і впаде на першому ж запиті.
      - name: Apply migrations
        env:
          # dotnet ef запускає Program.cs цілком, щоб дістати DbContext,
          # тому спрацьовує і наш запобіжник на BlobStorage. Міграції файлів
          # не торкаються, тому значення фіктивне - важлива лише форма.
          # Справжній ключ сховища пайплайну не потрібен.
          BlobStorage__ConnectionString: "DefaultEndpointsProtocol=https;AccountName=migrations;AccountKey=dGVzdA==;EndpointSuffix=core.windows.net"
          BlobStorage__ContainerName: "migrations"
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet tool install --global dotnet-ef

          # Рядок підключення беремо з налаштувань App Service - там він
          # уже є. Так пароль бази не стає ще одним секретом у GitHub.
          CONN=$(az webapp config appsettings list \
            -g jobportal-rg -n jobportal-pl-api \
            --query "[?name=='ConnectionStrings__Default'].value" -o tsv)

          # add-mask: Actions замінить це значення на зірочки, якщо воно
          # десь вилізе в лог. Без цього пароль бази опинився б у логах.
          echo "::add-mask::$CONN"

          dotnet ef database update \
            -p JobPortal.Infrastructure -s JobPortal.Api \
            --connection "$CONN"

      - name: Deploy
        run: az webapp deploy -g jobportal-rg -n jobportal-pl-api --src-path publish.zip --type zip

      # if: always() - правило закривається навіть якщо міграції впали.
      # Інакше кожен невдалий прогон лишав би відкриту дірку у фаєрволі.
      - name: Close SQL firewall
        if: always()
        run: |
          az sql server firewall-rule delete \
            -g jobportal-rg -s jobportal-sql-sasha2626 \
            -n gh-${{ github.run_id }} || true